<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nauči C++ za osnovnu školu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-3">

  <div class="mb-3">
    <label for="exerciseSelector" class="form-label">Odaberi zadatak:</label>
    <select id="exerciseSelector" class="form-select" onchange="loadExercise()">
      <option value="1">Zadatak 1: Cijeli broj</option>
      <option value="2">Zadatak 2: Decimalni broj</option>
      <option value="3">Zadatak 3: Cijeli broj korisnika</option>
      <option value="4">Zadatak 4: Decimalni broj korisnika</option>
      <option value="5">Zadatak 5: Broj više puta</option>
      <option value="6">Zadatak 6: Dvostruki broj</option>
      <option value="7">Zadatak 7: Formula</option>
      <option value="8">Zadatak 8: Hello World</option>
      <option value="9">Zadatak 9: Automobili</option>
      <option value="10">Zadatak 10: Voćke</option>
      <option value="11">Zadatak 11: Serije</option>
      <option value="12">Zadatak 12: Ponavljanje riječi</option>
      <option value="13">Zadatak 13: Riječ korisnika</option>
      <option value="14">Zadatak 14: Riječ korisnika više puta</option>
      <option value="15">Zadatak 15: Treće slovo riječi</option>
      <option value="16">Zadatak 16: Prvo slovo riječi</option>
      <option value="17">Zadatak 17: Dužina riječi</option>
      <option value="18">Zadatak 18: Zadnje slovo riječi</option>
      <option value="19">Zadatak 19: Broj veći od 9</option>
      <option value="20">Zadatak 20: Broj različit od 5</option>
      <option value="21">Zadatak 21: Broj jednak 11</option>
      <option value="22">Zadatak 22: Riječ duža od 10</option>
      <option value="23">Zadatak 23: Niz brojevi</option>
      <option value="24">Zadatak 24: Niz brojevi drugi primjer</option>
      <option value="25">Zadatak 25: Niz riječi</option>
    </select>
  </div>

  <div id="exerciseDescription" class="alert alert-info">
    Odaberi zadatak kako bi pročitao opis zadatka.
  </div>

  <iframe src="https://onecompiler.com/cpp" width="100%" height="600px"></iframe>

</div>

<script>
const exercises = {
  1: { description: 'Napiši program koji ispisuje cijeli broj 9.' },
  2: { description: 'Napiši program koji ispisuje decimalni broj 6.6.' },
  3: { description: 'Napiši program koji ispisuje cijeli broj unesen od korisnika.' },
  4: { description: 'Napiši program koji ispisuje decimalni broj unesen od korisnika.' },
  5: { description: 'Napiši program koji ispisuje 3 puta decimalni broj unesen od korisnika.' },
  6: { description: 'Napiši program koji ispisuje cijeli broj unesen od korisnika pomnožen sa dva.' },
  7: { description: 'Napiši program u kojem korisnik unosi decimalni broj x i ispisuje se vrijednost izraza 7x-2.' },
  8: { description: 'Napiši program koji ispisuje "Hello, World!".' },
  9: { description: 'Napiši program koji ispisuje: BMW Audi Mercedes Peugeot Fiat.' },
  10: { description: 'Napiši program koji ispisuje voćke jedno do drugog.' },
  11: { description: 'Napiši program koji ispisuje nazive serija bez razmaka.' },
  12: { description: 'Napiši program koji ispisuje riječ SEŠ 5 puta.' },
  13: { description: 'Napiši program koji ispisuje riječ koju je unijeo korisnik.' },
  14: { description: 'Napiši program koji ispisuje 3 puta riječ koju je unijeo korisnik.' },
  15: { description: 'Za unesenu riječ korisnika ispisati njeno treće slovo.' },
  16: { description: 'Za unesenu riječ korisnika ispisati njeno prvo slovo.' },
  17: { description: 'Za unesenu riječ korisnika ispisati koliko je duga (koliko slova ima).' },
  18:{ description: 'Za unesenu riječ korisnika ispisati njeno zadnje slovo.' },
  19:{ description: 'Za uneseni cijeli broj korisnika provjeriti da li je veći od broja 9.' },
  20:{ description: 'Za uneseni cijeli broj korisnika provjeriti da li je različit od 5.' },
  21:{ description: 'Za uneseni cijeli broj korisnika provjeriti da li je jednak broju 11.' },
  22:{ description: 'Za unesenu riječ korisnika provjeriti da li ima više od 10 slova.' },
  23:{ description: 'Napiši program koji sadrži niz brojeva 5, 9, 10, 11, 13, 21. Ispiši prvi element niza.' },
  24:{ description: 'Napiši program koji sadrži niz brojeva 2.5, 1.2, 10, 11, 13.1, 21. Ispiši element na indeksu 2.' },
  25:{ description: 'Napiši program koji sadrži niz riječi Patka, Guska, Kokoš. Ispiši riječ Kokoš iz niza.' }
};

function loadExercise() {
  const selected = document.getElementById("exerciseSelector").value;
  document.getElementById("exerciseDescription").textContent = exercises[selected].description;
}
</script>

</body>
</html>
